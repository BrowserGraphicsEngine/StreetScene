<HEAD>
<meta content="text/html;charset=utf-8" http-equiv="Content-Type">
<meta content="utf-8" http-equiv="encoding">
<TITLE>Street Scene Generated using a homemade WebGL Graphics Engine</TITLE>
<STYLE>
H1 { font-family: Impact, Charcoal, sans-serif; font-size: 36pt; color: #FFFFFF;}
H2 { font-family: Impact, Charcoal, sans-serif; font-size: 24pt; color: #FFFFFF;}
H3 { font-family: Impact, Charcoal, sans-serif; font-size: 18pt; color: #FFFFFF;}
TD, A, input[type=text]{ font-family: Impact, Charcoal, sans-serif; font-size: 26pt; color: #FFFFFF; background: transparent; border-style: none}
P { font-family: Impact, Charcoal, sans-serif; font-size: 12pt; color: #FFFFFF; background: transparent; border-style: none}
BODY,HTML {background-color: black; width:100%; height:100%; border: 0px; padding: 0px; margin: 0px; overflow-y: hidden; overflow-x: hidden;}
</STYLE>

<script src="javascript/engine.js" type="text/javascript"></script>

<!-- Fragment Shader -->
<script id="shader-fs" type="x-shader/x-fragment">
#ifdef GL_ES
precision mediump float;
#endif

uniform sampler2D uSampler;
varying mediump vec2 vTextureCoord;

void main(void) {
  gl_FragColor = texture2D(uSampler, vTextureCoord);
}
</script>

<!-- Vertex Shader -->
<script id="shader-vs" type="x-shader/x-vertex">
  attribute vec3 aVertexPosition;
  attribute vec2 aTextureCoord;

  uniform mat4 uMVMatrix;
  uniform mat4 uPMatrix;

  varying mediump vec2 vTextureCoord;

  void main(void) {
    gl_Position = uPMatrix * uMVMatrix * vec4(aVertexPosition, 1.0);
      vTextureCoord = aTextureCoord;
}
</script>

</HEAD>

<BODY onLoad="start();">

<canvas id="glcanvas" >Your browser doesn't appear to support the HTML5 <code>&lt;canvas&gt;</code> element.</canvas>

<div style="position: absolute; left: 20px; top: 20px; z-order: 1000">
  <table>
  <tr><td>Area</td><td><input type="text" value="1" visibility="hidden"></input></td></tr>
  <tr><td>FPS</td><td><input type="text" value="0" id="fps"></input></td></tr>
  <tr><td>X</td><td><input type="text" value="0" id="xlocation"></input></td></tr>
  <tr><td>Z</td><td><input type="text" value="0" id="zlocation"></input></td></tr>
  </table>
</div>

<div style="position: absolute; left: 0px; top: 20px; width: 100%; height: 400px; z-order: 1000; visibility: hidden;" id="framerate">
  <center>
    <H1>Frame Rate Too Low</H1>
    <H2>Your browser's frame rate is too low. Please use another browser.</H2>
  </center>
</div>

</BODY>
</HTML>
